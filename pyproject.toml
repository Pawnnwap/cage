[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cage"
version = "0.1.0"
description = "Containment-first agent control plane for Vultr Agent Rush"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "cryptography>=43",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
